<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memobyte-Unlimited | Ceph-Inspired Exabyte Cloud</title>
    <style>
        :root { bg: #0f172a; card-bg: #1e293b; accent: #38bdf8; text: #f8fafc; border: #334155; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 1250px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .btn { background: #0ea5e9; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0284c7; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; }
        .progress-container { background: #334155; border-radius: 4px; height: 8px; width: 100%; margin-top: 1rem; overflow: hidden; display: none; }
        .progress-bar { background: #38bdf8; height: 100%; width: 0%; transition: width 0.1s; }
        input[type="file"] { display: none; }
        .node-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #065f46; color: #34d399; }
        a { color: #38bdf8; text-decoration: none; cursor: pointer; }
        .action-links { display: flex; gap: 0.75rem; }
        
        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 8px; width: 700px; max-height: 85vh; overflow-y: auto; }
        .close-btn { float: right; background: #334155; border: none; color: white; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Memobyte-Unlimited</h2>
        <span>Status: <b style="color: #4ade80;">Cluster Ring & Map Active</b></span>
    </header>

    <div class="toolbar">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload Files</button>
        <button class="btn" onclick="document.getElementById('folderInput').click()">Upload Folder</button>
        
        <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
        <input type="file" id="folderInput" webkitdirectory directory multiple onchange="uploadFiles(this.files)">
    </div>

    <div class="grid">
        <div>
            <div class="card">
                <h3>Cluster Node Health</h3>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Host</th><th>Status</th></tr>
                    </thead>
                    <tbody id="nodeTable"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>Cluster Operations</h3>
                <div id="statusText" style="color: #94a3b8; font-size: 0.9rem;">Ready for transactions.</div>
                <div class="progress-container" id="progContainer">
                    <div class="progress-bar" id="progBar"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Distributed Object Pool (Ceph-Style Explorer)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Object / Asset Name</th>
                        <th>Cluster Management Actions</th>
                    </tr>
                </thead>
                <tbody id="fileTable"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- File View / Preview Modal -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('previewModal')">Close</button>
        <h3 id="previewTitle" style="margin-top: 0; color: #38bdf8;">File Preview</h3>
        <div id="previewBody" style="margin-top: 1rem;"></div>
    </div>
</div>

<!-- Ceph Object Map Inspector Modal -->
<div class="modal-overlay" id="inspectModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal('inspectModal')">Close</button>
        <h3 style="margin-top: 0;">RADOS Object Inspector</h3>
        <div id="inspectorBody" style="margin-top: 1rem; font-size: 0.9rem; color: #cbd5e1;"></div>
    </div>
</div>

<script>
    async function fetchClusterHealth() {
        const res = await fetch('/api/health');
        const nodes = await res.json();
        const table = document.getElementById('nodeTable');
        table.innerHTML = '';
        nodes.forEach(n => {
            table.innerHTML += `<tr><td>#${n.id}</td><td><code>${n.host}</code></td><td><span class="node-badge">${n.status.toUpperCase()}</span></td></tr>`;
        });
    }

    async function fetchFiles() {
        const res = await fetch('/api/files');
        const files = await res.json();
        const table = document.getElementById('fileTable');
        table.innerHTML = '';
        files.forEach(f => {
            table.innerHTML += `
                <tr>
                    <td>📦 ${f}</td>
                    <td>
                        <div class="action-links">
                            <a onclick="viewObject('${f}')">View</a>
                            <a onclick="inspectObject('${f}')">Inspect Map</a>
                            <a href="/files/${f}" download style="color: #34d399;">Download</a>
                            <a onclick="deleteFile('${f}')" style="color: #f43f5e;">Delete</a>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    async function viewObject(fileName) {
        document.getElementById('previewTitle').innerText = `Viewing: ${fileName}`;
        const body = document.getElementById('previewBody');
        body.innerHTML = '<p style="color: #94a3b8;">Assembling and decrypting chunks from cluster...</p>';
        document.getElementById('previewModal').style.display = 'flex';

        try {
            const res = await fetch(`/files/${fileName}`);
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const ext = fileName.split('.').pop().toLowerCase();

            if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
                body.innerHTML = `<img src="${url}" style="max-width: 100%; max-height: 70vh; display: block; margin: 0 auto; border-radius: 4px;">`;
            } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                body.innerHTML = `<video controls autoplay src="${url}" style="width: 100%; max-height: 70vh; border-radius: 4px;"></video>`;
            } else if (['mp3', 'wav', 'ogg'].includes(ext)) {
                body.innerHTML = `<audio controls autoplay src="${url}" style="width: 100%; margin-top: 1rem;"></audio>`;
            } else if (ext === 'pdf') {
                body.innerHTML = `<iframe src="${url}" style="width: 100%; height: 70vh; border: none; border-radius: 4px;"></iframe>`;
            } else {
                const text = await blob.text();
                body.innerHTML = `<pre style="background: #0b0f19; padding: 1rem; border-radius: 6px; overflow-x: auto; max-height: 70vh; color: #38bdf8; font-family: monospace; font-size: 0.85rem;"><code>${escapeHtml(text)}</code></pre>`;
            }
        } catch (err) {
            body.innerHTML = `<p style="color: #f43f5e;">Error rendering preview for ${fileName}</p>`;
        }
    }

    async function inspectObject(fileName) {
        const res = await fetch(`/api/inspect?file=${encodeURIComponent(fileName)}`);
        const data = await res.json();
        
        let chunksHtml = '';
        data.chunks.forEach(c => {
            chunksHtml += `<tr><td><code>${c.chunk_name}</code></td><td>Node #${c.node_id} (${c.node_host})</td><td>${c.size_bytes} bytes</td></tr>`;
        });

        document.getElementById('inspectorBody').innerHTML = `
            <p><b>Object Key:</b> ${data.filename}</p>
            <p><b>Encryption Status:</b> AES-256-GCM Secure</p>
            <p><b>Total Chunks (Shards):</b> ${data.total_chunks}</p>
            <h4 style="margin-top: 1rem;">Placement Group Shard Map:</h4>
            <table>
                <thead><tr><th>Shard Name</th><th>Assigned Node</th><th>Size</th></tr></thead>
                <tbody>${chunksHtml}</tbody>
            </table>
        `;
        document.getElementById('inspectModal').style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function deleteFile(fileName) {
        if (!confirm(`Purge object '${fileName}' from the cluster pool?`)) return;
        await fetch(`/api/delete?file=${encodeURIComponent(fileName)}`, { method: 'DELETE' });
        fetchFiles();
    }

    async function uploadFiles(files) {
        if (!files.length) return;
        const progContainer = document.getElementById('progContainer');
        const progBar = document.getElementById('progBar');
        const statusText = document.getElementById('statusText');
        progContainer.style.display = 'block';

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            let formData = new FormData();
            formData.append('file', file, file.webkitRelativePath || file.name);
            statusText.innerText = `Sharding & Replicating: ${file.name}`;

            await new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) progBar.style.width = ((e.loaded / e.total) * 100) + '%';
                };
                xhr.onload = resolve;
                xhr.open('POST', '/api/upload', true);
                xhr.send(formData);
            });
        }
        progContainer.style.display = 'none';
        fetchFiles();
    }

    fetchClusterHealth();
    fetchFiles();
</script>

</body>
</html>
