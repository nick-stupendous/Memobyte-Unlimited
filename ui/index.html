<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memobyte-Unlimited | Secure Exabyte Cloud</title>
    <style>
        :root { bg: #0f172a; card-bg: #1e293b; accent: #38bdf8; text: #f8fafc; border: #334155; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 2rem; }
        .toolbar { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
        .btn { background: #0ea5e9; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0284c7; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; }
        .progress-container { background: #334155; border-radius: 4px; height: 8px; width: 100%; margin-top: 1rem; overflow: hidden; display: none; }
        .progress-bar { background: #38bdf8; height: 100%; width: 0%; transition: width 0.1s; }
        input[type="file"] { display: none; }
        .node-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #065f46; color: #34d399; }
        a { color: #38bdf8; text-decoration: none; }
        .action-links { display: flex; gap: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Memobyte-Unlimited</h2>
        <span>Status: <b style="color: #4ade80;">Encrypted Ring Active</b></span>
    </header>

    <div class="toolbar">
        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload Files</button>
        <button class="btn" onclick="document.getElementById('folderInput').click()">Upload Folder</button>
        
        <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
        <input type="file" id="folderInput" webkitdirectory directory multiple onchange="uploadFiles(this.files)">
    </div>

    <div class="grid">
        <div>
            <div class="card">
                <h3>Cluster Node Health</h3>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Host</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="nodeTable"></tbody>
                </table>
            </div>

            <div class="card">
                <h3>Upload Transfer Center</h3>
                <div id="statusText" style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">Ready for secure streaming.</div>
                <div class="progress-container" id="progContainer">
                    <div class="progress-bar" id="progBar"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Cloud File Explorer (AES-256 Secured)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Asset Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="fileTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function fetchClusterHealth() {
        try {
            const res = await fetch('/api/health');
            const nodes = await res.json();
            const table = document.getElementById('nodeTable');
            table.innerHTML = '';
            nodes.forEach(node => {
                table.innerHTML += `
                    <tr>
                        <td>#${node.id}</td>
                        <td><code>${node.host}</code></td>
                        <td><span class="node-badge">${node.status.toUpperCase()}</span></td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Failed to query node health");
        }
    }

    async function fetchFiles() {
        try {
            const res = await fetch('/api/files');
            const files = await res.json();
            const table = document.getElementById('fileTable');
            table.innerHTML = '';
            files.forEach(f => {
                table.innerHTML += `
                    <tr>
                        <td>🔒 ${f}</td>
                        <td>
                            <div class="action-links">
                                <a href="/files/${f}" target="_blank">Download</a>
                                <a href="#" onclick="deleteFile('${f}')" style="color: #f43f5e;">Delete</a>
                            </div>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            console.error("Error fetching file tree");
        }
    }

    async function deleteFile(fileName) {
        if (!confirm(`Permanently delete '${fileName}' across the cluster ring?`)) return;

        const res = await fetch(`/api/delete?file=${encodeURIComponent(fileName)}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            fetchFiles();
        } else {
            alert('Failed to delete asset.');
        }
    }

    async function uploadFiles(files) {
        if (!files.length) return;
        const progContainer = document.getElementById('progContainer');
        const progBar = document.getElementById('progBar');
        const statusText = document.getElementById('statusText');
        
        progContainer.style.display = 'block';

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            let relativePath = file.webkitRelativePath || file.name;

            statusText.innerText = `Encrypting & Replicating (${i+1}/${files.length}): ${relativePath}`;

            const formData = new FormData();
            formData.append('file', file, relativePath);

            await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        let percent = (e.loaded / e.total) * 100;
                        progBar.style.width = percent + '%';
                    }
                };
                xhr.onload = () => { if (xhr.status === 200) resolve(); else reject(); };
                xhr.open('POST', '/api/upload', true);
                xhr.send(formData);
            });
        }

        statusText.innerText = "[✓] Batch payload encrypted and synced across cluster.";
        progBar.style.width = '0%';
        progContainer.style.display = 'none';
        fetchFiles();
    }

    fetchClusterHealth();
    fetchFiles();
</script>

</body>
</html>
